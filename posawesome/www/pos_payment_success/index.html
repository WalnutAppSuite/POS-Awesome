{% extends "templates/web.html" %}

{% block page_content %}
<div style="text-align: center; padding: 40px 20px;">
	{% if show_message %}
		<h2 style="color: #28a745;">&#10004; {{ message }}</h2>
	{% else %}
		<h2>Processing payment...</h2>
	{% endif %}
	<p style="margin-top: 20px; color: #666;">This page will close automatically. If not, you can close it manually.</p>
</div>
{% endblock %}
